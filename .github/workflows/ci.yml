name: CI - UBS Perto de Você

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependências do Backend
        working-directory: ./backend
        run: npm ci

      - name: Verificação de Tipos (Typecheck)
        working-directory: ./backend
        run: npm run lint

      - name: Executar Testes Automatizados (Vitest)
        working-directory: ./backend
        run: npm test

      - name: Compilar Build de Produção
        working-directory: ./backend
        run: npm run build

  frontend-checks:
    name: Frontend Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Verificação de Tipos (Typecheck)
        working-directory: ./frontend
        run: npm run lint

      - name: Executar Testes Automatizados (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Compilar Build do SPA (Vite)
        working-directory: ./frontend
        run: npm run build
